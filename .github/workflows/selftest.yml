name: selftest

# Runs the release tool's unit tests with ephemeral throwaway keys. Needs no write access.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/**'
      - 'release-config.json'
      - 'ledger/**'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node .github/scripts/lib.test.mjs
      - name: Installer inspection tests (needs the runner's 7z)
        run: node .github/scripts/installer-inspection.test.mjs
      - name: Config and ledger sanity
        run: node .github/scripts/check-static.mjs
